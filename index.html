<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <title>Meneimay Chat</title>
  <style>
    :root { --ink:#071a3d; --blue:#0a2b66; --soft:#f4f7fb; --line:#e4eaf3; --muted:#6a7690; --bubble:#edf3ff; --danger:#c63c4b; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100dvh; background:#fff; color:var(--ink); font-family:"Segoe UI",Tahoma,Arial,sans-serif; }
    button, textarea, input { font:inherit; } button { cursor:pointer; }
    .app { min-height:100dvh; display:flex; }
    /* The drawer always opens from the left, beside the three-line menu button. */
    .sidebar { width:300px; position:fixed; inset:0 auto 0 0; z-index:20; background:#fff; border-inline-end:1px solid var(--line); padding:18px 14px; display:flex; flex-direction:column; transform:translateX(-102%); transition:transform .25s ease; box-shadow:15px 0 35px rgba(5,24,58,.07); }
    .sidebar.open { transform:translateX(0); }
    .side-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
    .side-title { font-size:18px; font-weight:750; } .icon-btn { color:var(--blue); border:0; background:transparent; width:42px; height:42px; display:grid; place-items:center; border-radius:13px; }
    .icon-btn:hover { background:var(--soft); } svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
    .new-chat { width:100%; border:1px solid #d9e4f5; color:var(--blue); background:#f6f9ff; min-height:48px; border-radius:13px; display:flex; align-items:center; gap:10px; padding:0 14px; font-weight:700; }
    .new-chat svg { width:19px; } .side-label { margin:24px 10px 8px; font-size:12px; font-weight:750; color:var(--muted); }
    .history { overflow:auto; flex:1; } .history-item { width:100%; border:0; background:transparent; padding:11px 10px; text-align:start; color:var(--ink); border-radius:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .history-item:hover,.history-item.active { background:var(--soft); } .settings { border-top:1px solid var(--line); padding-top:14px; }
    .settings summary { list-style:none; display:flex; align-items:center; gap:10px; padding:8px; cursor:pointer; font-weight:700; }.settings summary::-webkit-details-marker{display:none}.settings svg{width:19px}
    .settings-panel{padding:10px 8px 0}.setting-row { display:flex; justify-content:space-between; align-items:center; margin:9px 0; font-size:14px; }.language-toggle { border:1px solid #d5dfed;background:white;border-radius:9px;padding:5px 9px;color:var(--blue);font-weight:700; }.clear-history{border:0;background:transparent;color:var(--danger);padding:6px 0;font-size:14px;}
    .overlay { position:fixed; inset:0; z-index:10; background:rgba(5,18,45,.22); opacity:0; visibility:hidden; transition:.2s; }.overlay.show{opacity:1;visibility:visible}
    .main { flex:1; min-width:0; min-height:100dvh; display:flex; flex-direction:column; }
    .top { height:76px; flex:0 0 auto; display:grid; grid-template-columns:1fr auto 1fr; align-items:center; padding:12px max(18px, calc((100vw - 1180px)/2)); }
    .brand { display:flex; align-items:center; gap:10px; font-weight:800; letter-spacing:-.3px; font-size:18px; color:var(--ink); }.brand-dot{width:11px;height:11px;border-radius:50%;background:var(--blue);box-shadow:13px 0 0 #76a8ff}
    .menu { justify-self:end; }.new-top { justify-self:start; display:flex; align-items:center; width:auto; gap:7px; padding:0 10px; font-size:13px; font-weight:700; color:var(--blue); }.new-top svg{width:20px}
    .chat { width:min(900px,100%); margin:0 auto; flex:1; padding:24px 22px 170px; overflow:auto; }.welcome { min-height:calc(100dvh - 260px); display:grid; place-items:center; text-align:center; align-content:center; gap:20px; }.welcome img{width:105px;height:105px;object-fit:contain;border-radius:28px}.welcome h1{font-size:clamp(22px,3vw,34px);letter-spacing:-.8px;margin:0;font-weight:800}.welcome p{margin:0;color:var(--muted);font-size:16px}
    .message { margin:18px 0 26px; }.message.user { display:flex; justify-content:flex-start; }.bubble { max-width:min(80%,680px); background:var(--bubble); padding:12px 15px; border-radius:18px 18px 4px 18px; white-space:pre-wrap; line-height:1.75; color:#112e5e; }.message.assistant { line-height:1.85; color:#15284e; }.message .actions { display:flex; gap:4px; margin-top:7px; }.message.user .actions{justify-content:flex-start}.action { color:#75839b; border:0; background:transparent; width:30px; height:30px; display:grid;place-items:center;border-radius:8px }.action:hover{color:var(--blue);background:var(--soft)}.action svg{width:17px}.message.assistant .content{white-space:pre-wrap}.message.assistant .content strong{font-weight:800}.message.assistant .content code{font-family:Consolas,monospace;background:#eff3f8;padding:1px 5px;border-radius:5px}.sources{display:flex;flex-wrap:wrap;gap:7px;margin-top:11px}.source{font-size:12px;border:1px solid #dfe7f2;color:var(--blue);padding:4px 8px;border-radius:99px;text-decoration:none;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .typing { display:flex;align-items:center;gap:6px;padding:5px 0;color:var(--muted);font-size:13px}.typing i{width:5px;height:5px;border-radius:50%;background:var(--blue);animation:blink 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes blink{50%{opacity:.15}}
    .composer-wrap { position:fixed; bottom:0; inset-inline:0; padding:12px 20px 20px; pointer-events:none; background:linear-gradient(transparent,white 35%); }.composer-area{max-width:900px;margin:auto;pointer-events:auto}.tool-name{min-height:21px;padding:0 10px;color:var(--blue);font-size:12px;font-weight:700}.composer { position:relative; background:#fff; border:1px solid #d6e0ed; box-shadow:0 10px 30px rgba(8,34,78,.10); border-radius:19px; padding:11px; }.composer:focus-within{border-color:#8bb1ef;box-shadow:0 10px 30px rgba(8,34,78,.15)} textarea { resize:none; width:100%; min-height:49px; max-height:160px; border:0; outline:0; padding:7px 7px 1px; color:var(--ink); background:transparent; line-height:1.55; }.composer-tools { display:flex; align-items:center; gap:2px; }.send { margin-inline-start:auto; background:var(--blue);color:#fff;width:37px;height:37px;border-radius:12px}.send:hover{background:#123d85}.send:disabled{opacity:.45;cursor:not-allowed}.send svg{width:18px}.tool-popup { position:absolute; inset-inline-start:0; bottom:calc(100% + 10px); width:min(325px,calc(100vw - 38px)); border:1px solid var(--line);background:#fff;border-radius:15px;box-shadow:0 15px 40px rgba(5,24,58,.14);padding:7px;display:none}.tool-popup.show{display:block}.tool-option{display:flex;align-items:start;gap:9px;border:0;background:#fff;width:100%;text-align:start;padding:9px;border-radius:10px;color:var(--ink)}.tool-option:hover,.tool-option.selected{background:var(--soft);color:var(--blue)}.tool-option b{display:block;font-size:13px}.tool-option span{display:block;color:var(--muted);font-size:11px;margin-top:2px;line-height:1.4}.tool-option svg{width:17px;flex:0 0 auto;margin-top:2px}.attach-list{display:flex;flex-wrap:wrap;gap:6px;padding:0 5px 5px}.file-pill{font-size:12px;background:var(--soft);color:var(--blue);padding:4px 7px;border-radius:7px}.file-pill button{border:0;background:none;color:var(--danger);margin-inline-start:4px;padding:0}
    @media (max-width:540px){.top{height:65px;padding:8px 10px}.new-top span{display:none}.chat{padding:14px 15px 165px}.bubble{max-width:92%}.welcome h1{font-size:24px}.welcome img{width:90px;height:90px}.composer-wrap{padding:8px 11px 13px}.composer{border-radius:16px}.sidebar{width:285px}.brand{font-size:16px}}
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="القائمة الجانبية">
      <div class="side-head"><span class="side-title" data-i18n="menu">القائمة</span><button class="icon-btn" id="closeMenu" aria-label="إغلاق القائمة"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></div>
      <button class="new-chat" id="newChatSide"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg><span data-i18n="newChat">محادثة جديدة</span></button>
      <div class="side-label" data-i18n="history">سجل المحادثات</div><div class="history" id="history"></div>
      <details class="settings"><summary><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.1 2.1-.06-.06A1.7 1.7 0 0 0 15.76 18a1.7 1.7 0 0 0-1 1.55V20h-3v-.45a1.7 1.7 0 0 0-1-1.55 1.7 1.7 0 0 0-1.88.34l-.06.06-2.1-2.1.06-.06A1.7 1.7 0 0 0 7.12 14a1.7 1.7 0 0 0-1.55-1H5v-3h.57A1.7 1.7 0 0 0 7.12 9a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.1-2.1.06.06A1.7 1.7 0 0 0 10.76 5a1.7 1.7 0 0 0 1-1.55V3h3v.45a1.7 1.7 0 0 0 1 1.55 1.7 1.7 0 0 0 1.88-.34l.06-.06 2.1 2.1-.06.06A1.7 1.7 0 0 0 19.4 9c.2.6.78 1 1.43 1H21v3h-.57A1.7 1.7 0 0 0 19.4 15Z"/></svg><span data-i18n="settings">الإعدادات</span></summary><div class="settings-panel"><div class="setting-row"><span data-i18n="language">اللغة</span><button class="language-toggle" id="langToggle">English</button></div><button class="clear-history" id="clearHistory" data-i18n="clear">مسح سجل الدردشة</button></div></details>
    </aside><div class="overlay" id="overlay"></div>
    <main class="main"><header class="top"><button class="icon-btn new-top" id="newChatTop" aria-label="محادثة جديدة"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L8 18l-4 1 1-4Z"/></svg><span data-i18n="newChat">محادثة جديدة</span></button><div class="brand"><i class="brand-dot"></i>Meneimay Chat</div><button class="icon-btn menu" id="openMenu" aria-label="فتح القائمة"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button></header>
      <section class="chat" id="chat"><div class="welcome" id="welcome"><img src="https://i.postimg.cc/rs1DtgC4/20260824-192552.png" alt="Meneimay logo"/><h1 data-i18n="welcome">مرحبًا يا صديق منعم، هيا ابدأ معي موضوعًا جديدًا</h1><p data-i18n="welcomeSub">أنا هنا لأساعدك في التفكير، الكتابة، والتسويق</p></div></section>
      <div class="composer-wrap"><div class="composer-area"><div class="tool-name" id="toolName"></div><div class="composer"><div class="tool-popup" id="toolPopup"></div><div class="attach-list" id="attachList"></div><textarea id="prompt" rows="1" data-i18n-placeholder="placeholder" placeholder="اكتب رسالتك هنا..."></textarea><div class="composer-tools"><button class="icon-btn" id="toolsButton" aria-label="الأدوات"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v18M3 12h18"/><circle cx="12" cy="12" r="9"/></svg></button><label class="icon-btn" aria-label="إرفاق ملف"><input type="file" id="fileInput" hidden multiple accept="image/*,.txt,.csv,.pdf,.doc,.docx,.xlsx"/><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21.4 11.6-8.9 8.9a6 6 0 0 1-8.5-8.5l9.2-9.2a4 4 0 0 1 5.7 5.7l-9.2 9.2a2 2 0 1 1-2.8-2.8l8.5-8.5"/></svg></label><button class="icon-btn" id="micButton" aria-label="التحدث"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/></svg></button><button class="icon-btn send" id="send" aria-label="إرسال"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m20 4-8 16-3.3-7.3L1 9l19-5Z"/><path d="m8.7 12.7 4.6-4.6"/></svg></button></div></div></div></div>
    </main>
  </div>
  <script>
  (() => {
    const $ = s => document.querySelector(s), icon = p => `<svg viewBox="0 0 24 24"><path d="${p}"/></svg>`;
    const copyIcon = 'M9 9h10v11H9zM5 15H4V4h11v1', editIcon = 'M4 20h4L19 9l-4-4L4 16v4Z', tools = [
      {id:'none', ar:'بدون أداة', en:'No tool', descAr:'دردشة عادية', descEn:'Regular conversation'},
      {id:'content', ar:'كتابة المحتوى', en:'Content writing', descAr:'منشورات تسويقية جاهزة للنشر', descEn:'Publish-ready marketing copy'},
      {id:'research', ar:'التحليل والبحث التسويقي', en:'Market research', descAr:'بحث وتحليل مع مصادر', descEn:'Research and analysis with sources'},
      {id:'strategy', ar:'التخطيط الاستراتيجي', en:'Strategic planning', descAr:'خطة تسويق عملية قابلة للتنفيذ', descEn:'Practical marketing strategy'},
      {id:'ads', ar:'تحليل الإعلانات', en:'Ad analysis', descAr:'تحليل النتائج والتوصيات', descEn:'Performance analysis and actions'},
      {id:'creative', ar:'اقتراح الكرييتف', en:'Creative ideas', descAr:'أفكار إعلانية وزوايا مبتكرة', descEn:'Fresh campaign concepts'}
    ];
    const text = { ar:{menu:'القائمة',newChat:'محادثة جديدة',history:'سجل المحادثات',settings:'الإعدادات',language:'اللغة',clear:'مسح سجل الدردشة',welcome:'مرحبًا يا صديق منعم، هيا ابدأ معي موضوعًا جديدًا',welcomeSub:'أنا هنا لأساعدك في التفكير، الكتابة، والتسويق',placeholder:'اكتب رسالتك هنا...',thinking:'مناعماي يفكر...',error:'تعذر الحصول على إجابة الآن. تأكد من إعداد مفتاح Gemini وحاول مرة أخرى.',copied:'تم النسخ'}, en:{menu:'Menu',newChat:'New chat',history:'Chat history',settings:'Settings',language:'Language',clear:'Clear chat history',welcome:'Hello, my friend Monem. Let’s start a new topic together.',welcomeSub:'I’m here to help you think, write, and market.',placeholder:'Write your message here...',thinking:'Meneimay is thinking...',error:'Could not get an answer. Check the Gemini key setup and try again.',copied:'Copied'} };
    let lang=localStorage.getItem('meneimayLang')||'ar', currentId=null, activeTool='none', files=[], busy=false;
    let chats=JSON.parse(localStorage.getItem('meneimayChats')||'[]');
    const save=()=>localStorage.setItem('meneimayChats',JSON.stringify(chats)); const tr=k=>text[lang][k]||k;
    function applyLanguage(){ document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.querySelectorAll('[data-i18n]').forEach(e=>e.textContent=tr(e.dataset.i18n));document.querySelectorAll('[data-i18n-placeholder]').forEach(e=>e.placeholder=tr(e.dataset.i18nPlaceholder));$('#langToggle').textContent=lang==='ar'?'English':'العربية';renderTools();renderHistory();renderChat(); }
    function newChat(){currentId=crypto.randomUUID(); chats.unshift({id:currentId,title:lang==='ar'?'محادثة جديدة':'New chat',messages:[],createdAt:Date.now()});save();activeTool='none';files=[];$('#prompt').value='';renderChat();renderHistory();$('#prompt').focus();closeMenu();}
    function getChat(){return chats.find(c=>c.id===currentId)} function selectChat(id){currentId=id;activeTool='none';renderChat();renderHistory();closeMenu();}
    function renderHistory(){const root=$('#history');root.innerHTML='';chats.forEach(c=>{const b=document.createElement('button');b.className='history-item '+(c.id===currentId?'active':'');b.textContent=c.title;b.onclick=()=>selectChat(c.id);root.append(b)})}
    function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}
    function simpleMarkdown(s){return esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/^#{1,3}\s+(.+)$/gm,'<strong>$1</strong>');}
    function actionButton(path,label,fn){const b=document.createElement('button');b.className='action';b.title=label;b.innerHTML=icon(path);b.onclick=fn;return b;}
    function addMessage(m, append=true){const box=document.createElement('article');box.className='message '+m.role;const content=document.createElement('div');content.className=m.role==='user'?'bubble':'content';content.innerHTML=m.role==='assistant'?simpleMarkdown(m.text):esc(m.text);box.append(content);if(m.attachments?.length){const a=document.createElement('div');a.className='attach-list';m.attachments.forEach(f=>a.innerHTML+=`<span class="file-pill">${esc(f.name)}</span>`);box.append(a)}const actions=document.createElement('div');actions.className='actions';actions.append(actionButton(copyIcon,tr('copied'),async()=>{await navigator.clipboard.writeText(m.text);}),);if(m.role==='user')actions.append(actionButton(editIcon,'Edit',()=>{$('#prompt').value=m.text;$('#prompt').focus();autoGrow()}));box.append(actions);if(m.sources?.length){const ss=document.createElement('div');ss.className='sources';m.sources.forEach(s=>{const a=document.createElement('a');a.className='source';a.target='_blank';a.rel='noopener';a.href=s.uri;a.textContent=s.title||s.uri;ss.append(a)});box.append(ss)}if(append){$('#chat').append(box);box.scrollIntoView({behavior:'smooth',block:'end'})}return box;}
    function renderChat(){const root=$('#chat'),chat=getChat();root.innerHTML='';if(!chat||!chat.messages.length){root.innerHTML=`<div class="welcome" id="welcome"><img src="https://i.postimg.cc/rs1DtgC4/20260824-192552.png" alt="Meneimay logo"><h1>${tr('welcome')}</h1><p>${tr('welcomeSub')}</p></div>`;return;}chat.messages.forEach(m=>addMessage(m));setTimeout(()=>root.scrollTop=root.scrollHeight,0)}
    function renderTools(){const root=$('#toolPopup');root.innerHTML=tools.map(t=>`<button class="tool-option ${activeTool===t.id?'selected':''}" data-tool="${t.id}">${icon('M12 3v18M3 12h18')}<span><b>${lang==='ar'?t.ar:t.en}</b><span>${lang==='ar'?t.descAr:t.descEn}</span></span></button>`).join('');root.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{activeTool=b.dataset.tool;$('#toolPopup').classList.remove('show');$('#toolName').textContent=activeTool==='none'?'':(lang==='ar'?tools.find(t=>t.id===activeTool).ar:tools.find(t=>t.id===activeTool).en);renderTools()})}
    function renderFiles(){const r=$('#attachList');r.innerHTML=files.map((f,i)=>`<span class="file-pill">${esc(f.name)}<button data-file="${i}">×</button></span>`).join('');r.querySelectorAll('[data-file]').forEach(b=>b.onclick=()=>{files.splice(+b.dataset.file,1);renderFiles()})}
    function autoGrow(){const e=$('#prompt');e.style.height='auto';e.style.height=Math.min(e.scrollHeight,160)+'px'}
    async function encodeFile(file){if(file.size>6*1024*1024)throw new Error('FILE_TOO_LARGE');const base64=await new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]);r.onerror=no;r.readAsDataURL(file)});return {name:file.name,mimeType:file.type||'application/octet-stream',data:base64};}
    function setBusy(on){busy=on;$('#send').disabled=on;$('#prompt').disabled=on;}
    async function send(){const input=$('#prompt'),value=input.value.trim();if((!value&&!files.length)||busy)return;if(!currentId)newChat();const chat=getChat();let attachments=[];try{attachments=await Promise.all(files.map(encodeFile))}catch(e){alert(lang==='ar'?'يجب ألا يتجاوز حجم الملف 6 ميجابايت':'Each file must be 6 MB or smaller');return}const message={role:'user',text:value||'(مرفق ملف للتحليل)',attachments:files.map(f=>({name:f.name}))};chat.messages.push(message);if(chat.messages.length===1)chat.title=(value||files[0]?.name||'New chat').slice(0,42);save();input.value='';input.style.height='auto';files=[];renderFiles();$('#welcome')?.remove();addMessage(message);renderHistory();setBusy(true);const typing=document.createElement('div');typing.className='typing';typing.id='typing';typing.innerHTML=`<span>${tr('thinking')}</span><i></i><i></i><i></i>`;$('#chat').append(typing);typing.scrollIntoView({behavior:'smooth',block:'end'});
      try { const history=chat.messages.slice(-14).map(m=>({role:m.role,text:m.text}));const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history,attachments,tool:activeTool,language:lang})});const data=await res.json();if(!res.ok){const error=new Error(data.error||'REQUEST_FAILED');error.status=res.status;throw error}const answer={role:'assistant',text:data.text||'',sources:data.sources||[]};chat.messages.push(answer);save();typing.remove();addMessage(answer);renderHistory(); } catch(e){typing.remove();const temporary=e.status===503?(lang==='ar'?'خدمة Gemini مشغولة الآن. حاول مرة أخرى بعد لحظات.':'Gemini is busy right now. Please try again in a moment.'):tr('error');addMessage({role:'assistant',text:temporary});console.error(e)} finally {setBusy(false);input.focus();}
    }
    function openMenu(){$('#sidebar').classList.add('open');$('#overlay').classList.add('show')}function closeMenu(){$('#sidebar').classList.remove('open');$('#overlay').classList.remove('show')}
    $('#openMenu').onclick=openMenu;$('#closeMenu').onclick=closeMenu;$('#overlay').onclick=closeMenu;$('#newChatTop').onclick=newChat;$('#newChatSide').onclick=newChat;$('#toolsButton').onclick=()=>$('#toolPopup').classList.toggle('show');$('#langToggle').onclick=()=>{lang=lang==='ar'?'en':'ar';localStorage.setItem('meneimayLang',lang);applyLanguage()};$('#clearHistory').onclick=()=>{if(confirm(lang==='ar'?'هل تريد مسح سجل المحادثات بالكامل؟':'Delete all chat history?')){chats=[];currentId=null;save();renderHistory();renderChat();closeMenu()}};
    $('#prompt').addEventListener('input',autoGrow);$('#prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}});$('#send').onclick=send;$('#fileInput').onchange=e=>{files.push(...[...e.target.files]);e.target.value='';renderFiles()};$('#micButton').onclick=()=>{const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;if(!Speech){alert(lang==='ar'?'التحدث الصوتي غير مدعوم في هذا المتصفح':'Speech input is not supported in this browser');return}const r=new Speech();r.lang=lang==='ar'?'ar-EG':'en-US';r.onresult=e=>{$('#prompt').value+=e.results[0][0].transcript;autoGrow();$('#prompt').focus()};r.start()};
    if(chats.length)currentId=chats[0].id; applyLanguage(); renderFiles();
  })();
  </script>
</body>
</html>
